<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Deformation Chart</title>

<!--
  =========================================================================
  DEFMON PER-POINT CHART -- for use inside an Experience Builder Embed
  widget, with the URL driven by the widget's "Connect to data" dynamic
  URL feature (Station attribute -> ?station={Station}).

  ONE MERGED FEATURE CLASS
  --------------------------
  "Vertical Deformation Monitoring Points" and "Vertical & Horizontal
  Deformation Monitoring Points" have been merged into a single feature
  class / single hosted web layer, with a single related readings table.
  This page still auto-detects which SERIES to plot based on the
  station's prefix (see CONFIG.seriesRules below): vertical-only stations
  get just Delta Elevation; horiz+vert stations get Delta Elevation,
  Delta Northing, and Delta Easting as separate lines in the same chart.

  HOW THIS AUTHENTICATES
  -----------------------
  This page signs the VIEWER in with their own ArcGIS account (OAuth 2.0,
  handled by the ArcGIS Maps SDK's IdentityManager) and uses their token
  to query the feature service directly. Access is controlled by however
  you've shared the layer/table in ArcGIS -- e.g. share them with a
  specific group containing only the people who should see this data.
  No token or secret is ever hardcoded in this file.

  REQUIRED SETUP -- fill in the CONFIG block below before hosting this:
  -----------------------------------------------------------------------
  1. Register an OAuth 2.0 application (ArcGIS Online: My Content > New
     item > Application > "Other application"), set its redirect URI to
     wherever you host oauth-callback.html (same folder as this file),
     and copy its Client ID into CONFIG.clientId below.

  2. Find the merged layer's URL and relationship ID: open
     {serviceUrl}/{layerIndex}?f=pjson in a browser (with a valid token
     or via a session-carried click-through) and look at the
     "relationships" array.

  3. Update CONFIG.seriesRules if your station naming scheme ever changes
     or grows new prefixes.
  =========================================================================
-->

<script src="https://js.arcgis.com/4.30/"></script>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #ffffff;
  }
  #status {
    padding: 40px 12px;
    font-size: 16px;
    color: #555;
    text-align: center;
  }
  #status.error { color: #b00020; }
  #chart-container {
    width: 100%;
  }
  svg { display: block; }

  /* Custom hover tooltip -- real DOM, real interactivity. Multi-line
     content (one line per series) is supported via pre-line so \n in
     the tooltip text renders as real line breaks. */
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: #2b2b2b;
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    display: none;
    white-space: pre-line;
    line-height: 1.5;
    z-index: 1000;
  }
  .chart-point { cursor: pointer; }
</style>
</head>
<body>

<div id="status">Loading&hellip;</div>
<div id="chart-container"></div>
<div id="tooltip"></div>

<script>
require([
  "esri/identity/IdentityManager",
  "esri/identity/OAuthInfo",
  "esri/request"
], function (esriId, OAuthInfo, esriRequest) {

  // =======================================================================
  // CONFIG
  // =======================================================================
  var CONFIG = {
    clientId: "jgNbpPNmIzybM5HZ",
    portalUrl: "https://www.arcgis.com",
    stationField: "Station",
    readingDateField: "ReadingDate",
    yMin: -0.05,
    yMax: 0.05,

    // The one merged points layer + its one relationship to the merged
    // readings table.
    pointsLayerUrl: "https://services3.arcgis.com/W9pAkEJR9WoiNAM1/arcgis/rest/services/DMP_2600389/FeatureServer/0",
    relationshipId: 0,

    // Which delta fields to plot as separate lines, chosen by matching
    // the station's prefix. First matching rule wins; order matters if
    // prefixes could ever overlap (they don't currently). Labels use
    // "Delta <direction>" phrasing (e.g. "Delta Easting"), not
    // "<direction> Delta".
    seriesRules: [
      {
        prefixes: ["TMP-", "SWMP-"],
        series: [
          { field: "DeltaElevation", label: "\u0394 Elevation", color: "#1a73e8" },
          { field: "DeltaNorthing", label: "\u0394 Northing", color: "#d93025" },
          { field: "DeltaEasting", label: "\u0394 Easting", color: "#188038" }
        ]
      },
      {
        prefixes: ["SMP-", "UMP-", "FMP-", "LC-"],
        series: [
          { field: "DeltaElevation", label: "\u0394 Elevation", color: "#1a73e8" }
        ]
      }
    ]
  };
  // =======================================================================

  var statusEl = document.getElementById("status");
  var containerEl = document.getElementById("chart-container");
  var tooltipEl = document.getElementById("tooltip");

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
    statusEl.style.display = msg ? "block" : "none";
  }

  function getStationParam() {
    var params = new URLSearchParams(window.location.search);
    return params.get("station");
  }

  // Auto-detect which series list applies to a station, by prefix.
  function resolveSeries(station) {
    var upper = station.toUpperCase();
    for (var i = 0; i < CONFIG.seriesRules.length; i++) {
      var rule = CONFIG.seriesRules[i];
      for (var j = 0; j < rule.prefixes.length; j++) {
        if (upper.indexOf(rule.prefixes[j].toUpperCase()) === 0) {
          return rule.series;
        }
      }
    }
    return null;
  }

  // ---- 1. Sign in ----
  //
  // Selecting a different point on the map changes the Embed widget's URL
  // (?station=X), which reloads this page from scratch -- so without
  // manual persistence, IdentityManager forgets the sign-in every single
  // time and re-prompts. Esri's IdentityManager does NOT persist across
  // page loads by default; the documented pattern is to serialize its
  // state (toJSON()) into localStorage after signing in, and restore it
  // (initialize()) before the next sign-in check. This means the user
  // still sees one popup the very first time, but subsequent point
  // selections reuse that same signed-in session silently.
  var STORAGE_KEY = "defmon_chart_identity";

  try {
    var savedIdentity = localStorage.getItem(STORAGE_KEY);
    if (savedIdentity) {
      esriId.initialize(JSON.parse(savedIdentity));
    }
  } catch (e) {
    // Corrupt/unreadable saved state -- fall through to a normal sign-in.
  }

  function persistIdentity() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(esriId.toJSON()));
    } catch (e) {
      // localStorage unavailable (private browsing, quota, etc.) --
      // sign-in still works, it just won't survive a reload.
    }
  }

  var oauthInfo = new OAuthInfo({
    appId: CONFIG.clientId,
    portalUrl: CONFIG.portalUrl,
    popup: true,          // popup keeps the parent Experience Builder page intact
    flowType: "auto"       // uses PKCE auth-code flow where supported
  });
  esriId.registerOAuthInfos([oauthInfo]);

  esriId.checkSignInStatus(CONFIG.portalUrl + "/sharing")
    .then(function () {
      persistIdentity();
      onSignedIn();
    })
    .catch(function () {
      setStatus("Sign-in required to view this chart.");
      esriId.getCredential(CONFIG.portalUrl + "/sharing")
        .then(function () {
          persistIdentity();
          onSignedIn();
        })
        .catch(function (err) {
          setStatus("Sign-in failed: " + (err && err.message ? err.message : err), true);
        });
    });

  function onSignedIn() {
    var station = getStationParam();
    if (!station) {
      setStatus("Select a monitoring point on the map to view its deformation data.");
      return;
    }

    var series = resolveSeries(station);
    if (!series) {
      setStatus("Station '" + station + "' doesn't match any configured prefix -- " +
                 "check CONFIG.seriesRules.", true);
      return;
    }

    setStatus("Loading readings for " + station + "\u2026");
    loadReadings(station, series);
  }

  // ---- 2. Look up the point's OBJECTID, then its related readings ----
  function loadReadings(station, series) {
    var whereClause = CONFIG.stationField + " = '" + station.replace(/'/g, "''") + "'";
    var seriesFields = series.map(function (s) { return s.field; });

    esriRequest(CONFIG.pointsLayerUrl + "/query", {
      query: {
        where: whereClause,
        outFields: "OBJECTID",
        f: "json"
      },
      responseType: "json"
    }).then(function (response) {
      var features = response.data && response.data.features;
      if (!features || features.length === 0) {
        setStatus("No point found for station '" + station + "'.", true);
        return;
      }
      var objectId = features[0].attributes.OBJECTID;

      return esriRequest(CONFIG.pointsLayerUrl + "/queryRelatedRecords", {
        query: {
          objectIds: objectId,
          relationshipId: CONFIG.relationshipId,
          outFields: [CONFIG.readingDateField].concat(seriesFields).join(","),
          orderByFields: CONFIG.readingDateField + " ASC",
          f: "json"
        },
        responseType: "json"
      });
    }).then(function (response) {
      if (!response) { return; }
      var groups = response.data && response.data.relatedRecordGroups;
      var readings = [];
      if (groups && groups.length > 0 && groups[0].relatedRecords) {
        readings = groups[0].relatedRecords.map(function (rec) {
          var values = {};
          seriesFields.forEach(function (f) {
            values[f] = rec.attributes[f];
          });
          return {
            date: new Date(rec.attributes[CONFIG.readingDateField]),
            values: values
          };
        });
      }
      setStatus("");
      drawChart(readings, series, station);
    }).catch(function (err) {
      setStatus("Error loading data: " + (err && err.message ? err.message : err), true);
    });
  }

  // ---- 3. Draw the chart as real, interactive SVG -- one line per series ----
  function drawChart(readings, seriesList, station) {
    var W = containerEl.clientWidth || 1400;
    var H = 260;
    var padL = 55, padR = 20, padT = 34, padB = 45;
    var yMin = CONFIG.yMin, yMax = CONFIG.yMax;
    var baselineGap = 50;

    var n = readings.length;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;
    var axisY = H - padB;
    var baselineX = padL;
    var datesPlotW = plotW - baselineGap;

    var firstDate = n > 0 ? readings[0].date : null;
    var lastDate = n > 0 ? readings[n - 1].date : null;
    var dateRangeMs = (firstDate && lastDate) ? (lastDate - firstDate) : 0;

    function xForIndex(i) {
      if (dateRangeMs === 0) {
        return padL + baselineGap + (n === 1 ? datesPlotW / 2 : datesPlotW * i / (n - 1));
      }
      var offsetMs = readings[i].date - firstDate;
      return padL + baselineGap + datesPlotW * offsetMs / dateRangeMs;
    }
    function yForValue(v) {
      return padT + plotH * (yMax - v) / (yMax - yMin);
    }
    function clamp(v) {
      if (v === null || v === undefined) { return 0; }
      if (v < yMin) { return yMin; }
      if (v > yMax) { return yMax; }
      return v;
    }
    function fmt2(v) {
      return (Math.round(v * 100) / 100).toFixed(2);
    }
    function fmtDate(d) {
      return (d.getMonth() + 1) + "/" + d.getDate() + "/" + String(d.getFullYear()).slice(-2);
    }

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    function addEl(tag, attrs, text) {
      var el = document.createElementNS(svgNS, tag);
      for (var k in attrs) { el.setAttribute(k, attrs[k]); }
      if (text !== undefined) { el.textContent = text; }
      svg.appendChild(el);
      return el;
    }

    addEl("rect", { x: 0, y: 0, width: W, height: H, fill: "#ffffff" });

    // Title -- top left, the selected station's name (e.g. "TMP-1"),
    // slightly larger than the axis/tick labels.
    addEl("text", { x: padL, y: 20, "font-size": 15, "font-weight": "600", fill: "#222" }, station);

    // Dashed gridlines every 0.01, baseline (0) solid + labeled
    var step = 0.01;
    for (var gv = yMin; gv <= yMax + 0.0001; gv += step) {
      var gy = yForValue(gv);
      var isBaseline = Math.abs(gv) < 0.0001;
      if (isBaseline) {
        addEl("line", { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: "#999", "stroke-width": 1 });
        addEl("text", { x: 4, y: gy + 4, "font-size": 12, fill: "#333" }, "Baseline");
      } else {
        addEl("line", { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: "#ddd", "stroke-width": 1, "stroke-dasharray": "3,3" });
        if (Math.abs(gv - yMin) < 0.0001 || Math.abs(gv - yMax) < 0.0001) {
          addEl("text", { x: 4, y: gy + 4, "font-size": 12, fill: "#333" }, fmt2(gv));
        }
      }
    }

    // Axes
    addEl("line", { x1: padL, y1: padT, x2: padL, y2: axisY, stroke: "#333" });
    addEl("line", { x1: padL, y1: axisY, x2: W - padR, y2: axisY, stroke: "#333" });

    var baselineY = yForValue(0);
    var tickBottom = axisY + 10;

    // Precompute one combined, stacked tooltip per date index -- every
    // series' value for that date, so hovering near ANY of them (even if
    // multiple series' points visually coincide) shows all of them, not
    // just whichever series happened to be drawn on top.
    var combinedTooltips = [];
    for (var idx = 0; idx < n; idx++) {
      var lines = [fmtDate(readings[idx].date)];
      seriesList.forEach(function (s) {
        var rv = readings[idx].values[s.field];
        lines.push(s.label + ": " + (rv === null || rv === undefined ? "n/a" : fmt2(rv) + " ft"));
      });
      combinedTooltips.push(lines.join("\n"));
    }

    // One line + set of points per series, all sharing the same baseline origin
    seriesList.forEach(function (s) {
      var pointsStr = baselineX + "," + baselineY + " ";
      for (var i = 0; i < n; i++) {
        var v = clamp(readings[i].values[s.field]);
        pointsStr += xForIndex(i) + "," + yForValue(v) + " ";
      }
      addEl("polyline", { points: pointsStr, fill: "none", stroke: s.color, "stroke-width": 2 });

      for (var j = 0; j < n; j++) {
        var rawValue = readings[j].values[s.field];
        var cv = clamp(rawValue);
        var cx = xForIndex(j);
        var cy = yForValue(cv);

        addPointWithTooltip(cx, cy, combinedTooltips[j], rawValue, s.color);
      }
    });

    // Baseline point + tick/label (single, shared across all series)
    addPointWithTooltip(baselineX, baselineY, "Baseline", null, "#333");
    addEl("line", { x1: baselineX, y1: axisY, x2: baselineX, y2: tickBottom, stroke: "#666" });
    addTickLabel(baselineX, tickBottom, "Baseline");

    // X-axis date tick labels (thinned if dense) -- independent of series count
    var maxLabels = Math.max(1, Math.floor(datesPlotW / 35));
    var labelInterval = Math.max(1, Math.ceil(n / maxLabels));
    for (var k = 0; k < n; k++) {
      if (k % labelInterval === 0 || k === n - 1) {
        var tx = xForIndex(k);
        addEl("line", { x1: tx, y1: axisY, x2: tx, y2: tickBottom, stroke: "#666" });
        addTickLabel(tx, tickBottom, fmtDate(readings[k].date));
      }
    }

    function addTickLabel(x, y, text) {
      addEl("text", {
        x: x, y: y, dx: -4, dy: 3, "font-size": 12, fill: "#333",
        "text-anchor": "end",
        transform: "rotate(-45 " + x + " " + y + ")"
      }, text);
    }

    function addPointWithTooltip(cx, cy, tooltipText, rawValue, color) {
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "chart-point");

      var isOutlier = rawValue !== null && rawValue !== undefined && (rawValue < yMin || rawValue > yMax);

      var dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", cx);
      dot.setAttribute("cy", cy);
      dot.setAttribute("r", 3);
      dot.setAttribute("fill", isOutlier ? "#d93025" : color);
      g.appendChild(dot);

      // Bigger invisible hit target -- easier to hover than a 3px dot
      var hit = document.createElementNS(svgNS, "circle");
      hit.setAttribute("cx", cx);
      hit.setAttribute("cy", cy);
      hit.setAttribute("r", 8);
      hit.setAttribute("fill", "transparent");
      g.appendChild(hit);

      g.addEventListener("mouseenter", function (evt) {
        tooltipEl.textContent = tooltipText;
        tooltipEl.style.display = "block";
        positionTooltip(evt);
      });
      g.addEventListener("mousemove", positionTooltip);
      g.addEventListener("mouseleave", function () {
        tooltipEl.style.display = "none";
      });

      svg.appendChild(g);
    }

    function positionTooltip(evt) {
      // Measure after the tooltip's content/visibility is set so
      // offsetWidth reflects the current (possibly multi-line) text.
      var tw = tooltipEl.offsetWidth;
      var margin = 12;
      var overflowsRight = evt.clientX + margin + tw > window.innerWidth;

      if (overflowsRight) {
        tooltipEl.style.left = (evt.clientX - margin - tw) + "px";
      } else {
        tooltipEl.style.left = (evt.clientX + margin) + "px";
      }
      tooltipEl.style.top = (evt.clientY - 24) + "px";
    }

    containerEl.innerHTML = "";
    containerEl.appendChild(svg);
  }

});
</script>
</body>
</html>
